name: ecommerce_app
description: "Flutter E-Commerce Mini Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  # Cupertino icons
  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # API
  dio: ^5.11.0

  # Local Storage
  shared_preferences: ^2.5.3

  # UI / Responsive Design
  flutter_screenutil: ^5.9.3

  # Network Images
  cached_network_image: ^3.4.1

  # Loading UI
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - lib/assets/